<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FormFit | IBAN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Great+Vibes&display=swap">
<style>
  :root { --bg:#fbf5f9; --ink:#2b1726; --muted:#8a6f82; --brand:#b7539c; --brand-deep:#93407d; --card:#ffffff; --line:#ecd9e6;
          --sans:'Jost',Poppins,Arial,Helvetica,sans-serif; --script:'Great Vibes',cursive; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); }
  body { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:28px 18px; position:relative; overflow-x:hidden; }
  .blob { position:fixed; border-radius:50%; pointer-events:none; filter:blur(2px); }
  .b1 { width:340px; height:340px; top:-140px; right:-120px; background:radial-gradient(circle,rgba(183,83,156,.22),transparent 70%); }
  .b2 { width:300px; height:300px; bottom:-130px; left:-110px; background:radial-gradient(circle,rgba(183,83,156,.16),transparent 70%); }
  main { position:relative; z-index:1; width:100%; max-width:420px; text-align:center; }
  .logo { width:168px; height:168px; border-radius:50%; display:block; margin:0 auto 20px; box-shadow:0 0 0 8px rgba(183,83,156,.12),0 14px 34px rgba(147,64,125,.30); }
  .script { font-family:var(--script); font-size:34px; color:var(--brand); margin:0; line-height:1; }
  h1 { font-size:13px; font-weight:500; letter-spacing:6px; text-transform:uppercase; margin:6px 0 22px; color:var(--muted); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:26px; padding:24px 22px; text-align:left; box-shadow:0 20px 44px rgba(147,64,125,.12); }
  .label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:2px; margin:0 0 5px; }
  .value { font-size:15px; font-weight:500; line-height:1.4; margin:0 0 16px; padding-bottom:16px; border-bottom:1px solid var(--line); }
  .iban { font-size:19px; font-weight:600; letter-spacing:1.2px; word-break:break-word; margin:0; color:var(--brand-deep); font-variant-numeric:tabular-nums; }
  button { width:100%; margin-top:22px; padding:16px; border:0; border-radius:999px; background:var(--brand); color:#fff; font-size:16px; font-weight:600; letter-spacing:.5px; font-family:inherit; cursor:pointer; box-shadow:0 10px 22px rgba(183,83,156,.35); transition:background .2s; }
  button:hover { background:var(--brand-deep); }
  button:focus-visible { outline:3px solid var(--ink); outline-offset:3px; }
  button:active { transform:scale(.98); }
  .holder { margin:0; }
  button.mini { width:auto; margin-top:12px; padding:9px 16px; font-size:13px; background:transparent; color:var(--brand-deep); border:1.5px solid var(--brand); box-shadow:none; }
  button.mini:hover { background:var(--brand); color:#fff; }
  .note { font-size:13px; color:var(--muted); margin-top:16px; }
  .brand { margin-top:22px; font-size:10px; letter-spacing:5px; color:var(--muted); text-transform:uppercase; opacity:.8; }
</style>
</head>

<script>
  var msg = document.getElementById('msg');
  function copyText(text, okText) {
    function ok() { msg.textContent = okText; msg.style.color = '#93407d'; }
    function fallback() {
      var t = document.createElement('textarea');
      t.value = text; t.style.position = 'fixed'; t.style.opacity = '0';
      document.body.appendChild(t); t.select();
      try { document.execCommand('copy'); ok(); } catch (e) { msg.textContent = 'Kopyalanamadı, metni elle seçin.'; }
      document.body.removeChild(t);
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(ok, fallback);
    } else { fallback(); }
  }
  document.querySelectorAll('[data-copy]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var text = document.getElementById(btn.dataset.copy).textContent.trim();
      if (btn.dataset.strip) text = text.replace(/\s/g, '');
      copyText(text, btn.dataset.ok);
    });
  });
</script>
